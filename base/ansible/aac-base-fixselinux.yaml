---
# version: 1.0.5

- name: AAC Base Fixselinux
  hosts: localhost
  become_user: root
  tasks:
     - name: Check if ssh reset already completed
       ansible.builtin.stat:
          path: /etc/ssh/.resetdone
       register: stat_result

     - name: Remove IDs
       become: true
       ansible.builtin.file:
          path: /etc/machine-id
          state: absent
       when: (not stat_result.stat.exists) and (ansible_os_family == "RedHat")

     - name: Find ssh_host files
       become: true
       ansible.builtin.find:
          paths: /etc/ssh
          patterns: 'ssh_host_*'
          use_regex: true
       register: find_result
       when: (not stat_result.stat.exists) and (ansible_os_family == "RedHat")

     - name: Remove host keys
       become: true
       ansible.builtin.file:
          path: "{{ item.path }}"
          state: absent
       with_items: "{{ find_result.files }}"
       when: (not stat_result.stat.exists) and (ansible_os_family == "RedHat")

     - name: Reset SSH Keys/UUID of VM
       become: true
       ansible.builtin.command: "/usr/bin/systemd-machine-id-setup"
       when: (not stat_result.stat.exists) and (ansible_os_family == "RedHat")

     - name: Mark ssh reset done
       become: true
       ansible.builtin.file:
          path: /etc/ssh/.resetdone
          state: touch
          mode: "0644"
       when: (not stat_result.stat.exists) and (ansible_os_family == "RedHat")

     - name: Restart sshd
       become: true
       ansible.builtin.service:
          name: sshd
          state: restarted
       when: ansible_os_family == "RedHat"

     - name: Reset SELinux after installs
       become: true
       ansible.builtin.command: restorecon -R -v /
       when: (ansible_distribution != "MacOSX") and
             (ansible_os_family != "VMware Photon OS") and
             (ansible_os_family != "Alpine")

...
