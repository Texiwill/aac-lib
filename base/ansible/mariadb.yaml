---
# version: 1.0.2

- name: TZ
  import_playbook: aac-base-tz.yaml

- name: SELinux
  import_playbook: aac-base-selinux.yaml

- name: SQL
  import_playbook: aac-base-sql.yaml

- name: Install MariaDB
  hosts: localhost
  gather_facts: true
  tasks:
     - name: Update bind_addresses
       become: true
       ansible.builtin.lineinfile:
          path: /etc/my.cnf.d/mariadb-server.cnf
          regex: "^bind-addres=0.0.0.0"
          insertafter: "^pid-file="
          line: "bind-address=0.0.0.0"
          state: present

     - name: Restart mariadb
       become: true
       ansible.builtin.service:
          name: "mariadb"
          state: restarted
          enabled: true

     - name: Set Firewall Rules Ports
       become: true
       ansible.posix.firewalld:
          zone: public
          service: "{{ item }}"
          state: enabled
          permanent: true
          immediate: true
       loop:
          - mysql

- name: Fix SELinux
  import_playbook: aac-base-fixselinux.yaml
...
